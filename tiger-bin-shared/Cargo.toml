[package]
name = "tiger-bin-shared"
version = "1.6.9-alpha"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Shared binary library for ck3-tiger."
homepage = "https://github.com/9mirx0r/xTiger"
repository = "https://github.com/9mirx0r/xTiger"
readme = "../README.md"
rust-version = "1.88"

[dependencies]
tiger-lib = { path = "..", version = "1.6.9-alpha" }

anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
ratatui = "0.30"
# held back because of msrv
home = "0.5"
regex = "1.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
steamlocate = "2.0"
self-replace = "1"
thiserror = "2.0"
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
ansiterm = "0.12.2"

[target.'cfg(target_os = "windows")'.dependencies]
self_update = { version = "1", default-features = false, features = [
    "archive-zip",
    "ureq",
    "compression-zip-deflate",
] }

[target.'cfg(target_os = "linux")'.dependencies]
self_update = { version = "1", default-features = false, features = [
    "archive-tar",
    "ureq",
    "compression-tar-gz",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
