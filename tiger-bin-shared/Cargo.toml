[package]
name = "tiger-bin-shared"
version = "1.5.5-alpha"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Shared binary library for ck3-tiger."
homepage = "https://github.com/9mirx0r/xTiger"
repository = "https://github.com/9mirx0r/xTiger"
readme = "../README.md"
rust-version = "1.88"

[dependencies]
tiger-lib = { path = "..", version = "1.5.5-alpha" }

anyhow = "1"
cfg-if = "1"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
# held back because of msrv
home = "0.5"
regex = "1.10"
steamlocate = "2.0"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
ansiterm = "0.12.2"

[target.'cfg(target_os = "windows")'.dependencies]
self_update = { version = "0.42", features = [
    "archive-zip",
    "compression-zip-deflate",
] }

[target.'cfg(target_os = "linux")'.dependencies]
self_update = { version = "0.42", features = [
    "archive-tar",
    "compression-flate2",
] }

[lints]
workspace = true
