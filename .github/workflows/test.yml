on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: Quality Assurance

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    name: ${{ matrix.name }} test
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Test CK3
        run: cargo test -p tiger-lib --lib

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: fmt
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: CK3 clippy
        run: cargo clippy -p ck3-tiger

      - name: utils clippy
        run: cargo clippy -p utils

      - name: MCP server clippy
        run: cargo clippy -p xtiger-mcp --all-targets

  msrv:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    name: ${{ matrix.name }} msrv
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: CK3 msrv
        run: cargo check -p ck3-tiger

      - name: MCP server msrv
        run: cargo check -p xtiger-mcp

  mcp:
    name: MCP server tests
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Test MCP server
        run: cargo test -p xtiger-mcp
