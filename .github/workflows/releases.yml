on:
  push:
    tags:
      - v[0-9]+*

name: Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            extension:
            archive: tar.gz
          - os: windows-latest
            name: windows
            extension: .exe
            archive: zip
    name: ${{ matrix.name }} build
    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install msrv toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Get version
        id: version
        shell: bash
        run: |
          version=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ck3-tiger") | .version')
          ck3_pkgdir="ck3-tiger-${{ matrix.name }}-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ck3_pkgdir=$ck3_pkgdir" >> "$GITHUB_OUTPUT"

      - name: Verify version against tag
        shell: bash
        run: |
          test "${{ github.ref_name }}" = "${{ steps.version.outputs.version }}"

      - name: Build CK3
        run: cargo build --release -p ck3-tiger -p xtiger-mcp

      - name: Create output dir
        shell: bash
        run: |
          mkdir ${{ steps.version.outputs.ck3_pkgdir }}
          cp -p README.md filter.md annotations.md TODO.md CONTRIBUTORS.md LICENSE ck3-tiger.conf target/release/ck3-tiger${{ matrix.extension }} target/release/ck3-tiger-auto${{ matrix.extension }} target/release/xtiger-mcp${{ matrix.extension }} ${{ steps.version.outputs.ck3_pkgdir }}

      - name: Archive .zip ck3
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: Compress-Archive -Path "${{ steps.version.outputs.ck3_pkgdir }}" -DestinationPath "${{ steps.version.outputs.ck3_pkgdir }}.zip"

      - name: Archive .tar.gz
        if: ${{ matrix.archive == 'tar.gz' }}
        run: |
          tar cfvz ${{ steps.version.outputs.ck3_pkgdir }}.tar.gz  ${{ steps.version.outputs.ck3_pkgdir }}/

      - name: Upload Archive ck3
        uses: actions/upload-artifact@v4
        with:
          name: archives-ck3-${{ matrix.name }}
          path: ${{ steps.version.outputs.ck3_pkgdir }}.${{ matrix.archive }}
          if-no-files-found: error

  app:
    name: windows app
    runs-on: windows-latest
    steps:

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
          cache-workspaces: |
            . -> target
            xtiger-app/src-tauri -> target

      - name: Install the Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Verify app version against tag
        shell: pwsh
        run: |
          $version = (Get-Content xtiger-app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tauri.conf.json has version $version, the tag is ${{ github.ref_name }}" }

      - name: Build the app, the setup and the portable zip
        shell: pwsh
        run: ./xtiger-app/build-release.ps1

      - name: Collect the app archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory app-archives | Out-Null
          Copy-Item xtiger-app/src-tauri/target/release/bundle/*.exe, xtiger-app/src-tauri/target/release/bundle/*.zip app-archives

      - name: Upload the app archives
        uses: actions/upload-artifact@v4
        with:
          name: archives-app-windows
          path: app-archives/*
          if-no-files-found: error

  release:
    needs: [build, app]
    name: Create Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # The newest section of CHANGELOG.md becomes the release notes, and its heading the title.
      - name: Release notes
        id: notes
        run: |
          title=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //')
          awk '/^## /{n++; next} n==1' CHANGELOG.md > release-notes.md
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Fetch Archives
        uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          merge-multiple: true

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.notes.outputs.title }}
          bodyFile: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          artifacts: '*.zip,*.tar.gz,*.exe'
