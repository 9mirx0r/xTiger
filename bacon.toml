default_job = "build_lib"
ignore = ["**/.*.swp"]

[jobs.build_lib]
command = ["cargo", "build", "--color", "always", "-p", "tiger-lib"]
need_stdout = false

[jobs.build_ck3]
command = ["cargo", "build", "--color", "always", "-p", "ck3-tiger"]
need_stdout = false

[jobs.clippy_lib]
command = ["cargo", "clippy", "--color", "always", "-p", "tiger-lib"]
need_stdout = false

[jobs.clippy_ck3]
command = ["cargo", "clippy", "--color", "always", "-p", "ck3-tiger"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--color", "always"]
need_stdout = true

[jobs.docs]
command = ["cargo", "doc", "--color", "always", "--no-deps", "--document-private-items"]
need_stdout = false

[keybindings]
"`" = "job:build_lib"
1 = "job:build_ck3"
"~" = "job:clippy_lib"
"!" = "job:clippy_ck3"
"d" = "job:docs"
