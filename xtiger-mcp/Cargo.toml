[package]
name = "xtiger-mcp"
version = "1.5.6-alpha"
edition = "2024"
license = "GPL-3.0-or-later"
description = "MCP server that lets AI assistants validate and play-test Crusader Kings III mods with xTiger."
homepage = "https://github.com/9mirx0r/xTiger"
repository = "https://github.com/9mirx0r/xTiger"
readme = "README.md"
rust-version = "1.88"

[lib]
name = "xtiger_mcp"
path = "src/lib.rs"

[[bin]]
name = "xtiger-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dirs = "6"
regex = "1.10"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.0"

[lints]
workspace = true
